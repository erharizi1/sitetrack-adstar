<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #F1F4F8; --surface: #FFFFFF; --ink: #1F2937; --ink-muted: #6B7280;
      --line: #E5E7EB; --accent: #2563EB; --accent-ink: #FFFFFF;
      --steel: #1D4ED8; --steel-soft: #DBEAFE;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--accent); color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #FFFFFF; text-decoration: none; } a:hover { color: #DBEAFE; }
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--accent); color:#FFFFFF; display:flex; flex-direction:column; justify-content:space-between; padding:28px 24px 32px;">

  <div style="display:flex; align-items:center; gap:10px;">
    <div style="width:40px; height:40px; border-radius:12px; background:#FFFFFF; display:flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
    </div>
    <div style="font-size:18px; font-weight:700;">SiteTrack</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:20px;">
    <div style="width:88px; height:88px; border-radius:99px; background:rgba(255,255,255,0.16); display:flex; align-items:center; justify-content:center;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
    </div>
    <div style="font-size:32px; font-weight:700; line-height:1.15; letter-spacing:-0.01em;">Shiko email-in</div>
    <div style="font-size:17px; line-height:1.5; color:rgba(255,255,255,0.92);">Të dërguam një link te<br><span style="font-weight:700; color:#FFFFFF;">agron.krasniqi@gmail.com</span></div>
  </div>

  <div style="display:flex; flex-direction:column; gap:12px;">
    <button style="min-height:64px; border:none; border-radius:14px; background:#FFFFFF; color:var(--accent); font-size:18px; font-weight:700;">Dërgo sërish</button>
    <button style="min-height:56px; border:2px solid rgba(255,255,255,0.85); border-radius:14px; background:transparent; color:#FFFFFF; font-size:16px; font-weight:600;">Ndrysho email-in</button>
  </div>

</div>
</x-dc>
</body>
</html>
