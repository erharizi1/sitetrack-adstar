<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #F1F4F8; --surface: #FFFFFF; --ink: #1F2937; --ink-muted: #6B7280;
      --line: #E5E7EB; --accent: #2563EB; --accent-ink: #FFFFFF;
      --steel: #1D4ED8; --steel-soft: #DBEAFE;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--steel); text-decoration: none; } a:hover { color: var(--accent); }
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--bg); display:flex; flex-direction:column; justify-content:center; gap:24px; padding:0 20px;">

  <div style="display:flex; align-items:center; gap:10px; padding:0 4px;">
    <div style="width:40px; height:40px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
    </div>
    <div style="font-size:17px; font-weight:700;">SiteTrack</div>
  </div>

  <div style="display:flex; align-items:center; gap:8px; padding:0 4px;">
    <div style="display:flex; align-items:center; gap:6px;">
      <div style="width:24px; height:24px; border-radius:99px; background:var(--accent); color:#FFFFFF; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">1</div>
      <span style="font-size:12.5px; font-weight:600;">Email</span>
    </div>
    <div style="flex:1; height:2px; background:var(--line);"></div>
    <div style="display:flex; align-items:center; gap:6px;">
      <div style="width:24px; height:24px; border-radius:99px; border:2px solid var(--line); color:var(--ink-muted); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">2</div>
      <span style="font-size:12.5px; color:var(--ink-muted);">Kontrollo</span>
    </div>
    <div style="flex:1; height:2px; background:var(--line);"></div>
    <div style="display:flex; align-items:center; gap:6px;">
      <div style="width:24px; height:24px; border-radius:99px; border:2px solid var(--line); color:var(--ink-muted); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700;">3</div>
      <span style="font-size:12.5px; color:var(--ink-muted);">Brenda</span>
    </div>
  </div>

  <div style="background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:24px 20px; display:flex; flex-direction:column; gap:20px; box-shadow:0 1px 3px rgba(31,41,55,0.06);">
    <div style="display:flex; flex-direction:column; gap:6px;">
      <div style="font-size:22px; font-weight:700; letter-spacing:-0.01em;">Hyr pa fjalëkalim</div>
      <div style="font-size:14.5px; line-height:1.5; color:var(--ink-muted);">Fut email-in me të cilin të ftuan. Të dërgojmë një link — e shtyp dhe je brenda.</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:13px; font-weight:600;">Email</div>
      <div style="min-height:52px; display:flex; align-items:center; padding:0 16px; background:var(--surface); border:2px solid var(--accent); border-radius:12px; font-size:15px;">agron.krasniqi@gmail.com</div>
    </div>
    <button style="min-height:56px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-size:15.5px; font-weight:600;">Dërgo linkun</button>
  </div>

  <div style="text-align:center; font-size:12.5px; color:var(--ink-muted);">Llogaritë krijohen vetëm me ftesë.</div>

</div>
</x-dc>
</body>
</html>
