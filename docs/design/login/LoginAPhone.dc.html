<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg: #F1F4F8; --surface: #FFFFFF; --ink: #1F2937; --ink-muted: #6B7280;
      --line: #E5E7EB; --accent: #2563EB; --accent-ink: #FFFFFF;
      --steel: #1D4ED8; --steel-soft: #DBEAFE;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: var(--steel); text-decoration: none; } a:hover { color: var(--accent); }
  </style>
</helmet>

<div style="width:390px; height:844px; background:var(--bg); display:flex; flex-direction:column; justify-content:center; gap:28px; padding:0 24px;">

  <div style="display:flex; flex-direction:column; gap:18px;">
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:40px; height:40px; border-radius:12px; background:var(--accent); display:flex; align-items:center; justify-content:center;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/></svg>
      </div>
      <div style="font-size:17px; font-weight:700;">SiteTrack</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:6px;">
      <div style="font-size:26px; font-weight:700; letter-spacing:-0.01em;">Mirë se erdhe</div>
      <div style="font-size:14.5px; color:var(--ink-muted);">Hyr për të vazhduar te ditari ose paneli yt.</div>
    </div>
  </div>

  <div style="display:flex; flex-direction:column; gap:16px;">
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:13px; font-weight:600;">Email</div>
      <div style="min-height:52px; display:flex; align-items:center; padding:0 16px; background:var(--surface); border:1px solid var(--line); border-radius:12px; font-size:15px;">agron@kompania.al</div>
    </div>
    <div style="display:flex; flex-direction:column; gap:7px;">
      <div style="font-size:13px; font-weight:600;">Fjalëkalimi</div>
      <div style="min-height:52px; display:flex; align-items:center; justify-content:space-between; padding:0 4px 0 16px; background:var(--surface); border:2px solid var(--accent); border-radius:12px; font-size:15px; letter-spacing:0.15em;">
        <span>••••••••</span>
        <div style="width:44px; height:44px; display:flex; align-items:center; justify-content:center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg></div>
      </div>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:44px;">
      <div style="display:flex; align-items:center; gap:9px; min-height:44px;">
        <div style="width:22px; height:22px; border-radius:6px; background:var(--accent); display:flex; align-items:center; justify-content:center;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <span style="font-size:14px;">Më mbaj të lidhur</span>
      </div>
      <a style="min-height:44px; display:flex; align-items:center; font-size:14px; font-weight:600;">Harrove fjalëkalimin?</a>
    </div>
    <button style="min-height:56px; border:none; border-radius:12px; background:var(--accent); color:var(--accent-ink); font-size:15.5px; font-weight:600;">Hyr</button>
  </div>

  <div style="text-align:center; font-size:12.5px; color:var(--ink-muted);">Llogaritë krijohen nga administratori.</div>

</div>
</x-dc>
</body>
</html>
