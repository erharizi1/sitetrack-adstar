<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

    :root {
      --bg: #F6F2EA;
      --surface: #FFFFFF;
      --ink: #211C16;
      --ink-muted: #776C5C;
      --border: #E6DFD1;
      --accent: #D9700A;
      --accent-ink: #FFFFFF;
      --steel: #33566B;
      --steel-soft: #E3EBEF;
      --good: #2E7D4F;
      --good-soft: #E3F0E7;
      --danger: #B23A2E;
      --danger-soft: #F6E4E1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: 'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, h3, .num, .brand, .label-caps, button { font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif; }
    a { color: var(--steel); text-decoration: none; }
    a:hover { color: var(--accent); }
  </style>
</helmet>

<div style="width:390px; min-height:844px; background:var(--bg); display:flex; flex-direction:column; gap:28px; padding:28px 20px 32px;">

  <div style="display:flex; flex-direction:column; gap:2px;">
    <div class="brand" style="font-size:13px; font-weight:600; letter-spacing:0.08em; color:var(--accent); text-transform:uppercase;">SiteTrack</div>
    <h1 style="font-size:24px; font-weight:600; margin:0;">Mirëdita, Agron</h1>
    <div style="font-size:14px; color:var(--ink-muted);">E hënë, 7 Shtator &middot; Cilin projekt regjistrojmë sot?</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:16px;">

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:14px; box-shadow:0 1px 2px rgba(33,28,22,0.04);">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <div style="font-size:17px; font-weight:600;">Kompleksi Astir</div>
          <div style="display:flex; align-items:center; gap:5px; color:var(--ink-muted); font-size:13px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Tiranë, Astir</span>
          </div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:4px;"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="height:8px; background:var(--border); border-radius:99px; overflow:hidden;">
          <div style="height:100%; width:62%; background:var(--accent); border-radius:99px;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-muted);">
          <span>26.040.000 L shpenzuar</span>
          <span style="font-weight:600; color:var(--ink);">62%</span>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:12px;">
        <div style="font-size:12.5px; color:var(--ink-muted);">Buxheti total</div>
        <div class="num" style="font-size:15px; font-weight:600;">42.000.000 L</div>
      </div>
    </div>

    <div style="background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px; display:flex; flex-direction:column; gap:14px; box-shadow:0 1px 2px rgba(33,28,22,0.04);">
      <div style="display:flex; align-items:flex-start; justify-content:space-between; gap:12px;">
        <div style="display:flex; flex-direction:column; gap:4px;">
          <div style="font-size:17px; font-weight:600;">Rezidenca Liqeni</div>
          <div style="display:flex; align-items:center; gap:5px; color:var(--ink-muted); font-size:13px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
            <span>Tiranë, Liqeni i Thatë</span>
          </div>
        </div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0; margin-top:4px;"><path d="M9 18l6-6-6-6"/></svg>
      </div>
      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="height:8px; background:var(--border); border-radius:99px; overflow:hidden;">
          <div style="height:100%; width:18%; background:var(--steel); border-radius:99px;"></div>
        </div>
        <div style="display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-muted);">
          <span>3.330.000 L shpenzuar</span>
          <span style="font-weight:600; color:var(--ink);">18%</span>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:12px;">
        <div style="font-size:12.5px; color:var(--ink-muted);">Buxheti total</div>
        <div class="num" style="font-size:15px; font-weight:600;">18.500.000 L</div>
      </div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
