<!--
  Supabase → Authentication → Emails → "Magic link".
  Subject: Hyr në SiteTrack
  Paste everything below this comment as the message body.

  The link uses {{ .RedirectTo }} (the site that asked for it — live or local)
  and a token_hash, verified by app/auth/confirm/route.ts. Links last as long
  as the "Email OTP Expiration" setting — set it to 86400 (24 hours), which is
  what the screens and this email say.
-->
<div style="background:#F1F4F8;padding:24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1F2937;">
  <div style="max-width:520px;margin:0 auto;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:16px;padding:36px;">
    <div style="font-size:16px;font-weight:700;margin:0 0 20px;">SiteTrack</div>
    <p style="font-size:15px;line-height:1.6;margin:0 0 20px;">
      Shtyp butonin për të hyrë në SiteTrack — nuk të duhet fjalëkalim.
    </p>
    <a href="{{ .RedirectTo }}?token_hash={{ .TokenHash }}&type=email"
       style="display:inline-block;background:#2563EB;color:#FFFFFF;text-decoration:none;font-size:15px;font-weight:600;padding:14px 28px;border-radius:12px;">
      Hyr në SiteTrack
    </a>
    <p style="font-size:13px;line-height:1.5;color:#6B7280;margin:20px 0 0;">
      Linku vlen 24 orë dhe përdoret vetëm një herë. Nëse nuk e kërkove ti, mund ta injorosh këtë email.
    </p>
  </div>
</div>
